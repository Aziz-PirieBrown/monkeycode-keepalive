name: MonkeyCode Keep Alive

on:
  schedule:
    # 每天 UTC 03:00（北京时间 11:00）自动打卡一次
    - cron: '0 3 * * *'
  workflow_dispatch: # 支持手动点击 Run workflow 触发测试

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Secrets
        run: |
          if [ -z "${{ secrets.MONKEY_COOKIE }}" ] || [ -z "${{ secrets.MONKEY_TASK_ID }}" ]; then
            echo "❌ 缺少必要 Secret 配置！"
            echo "请前往该仓库的 Settings -> Secrets and variables -> Actions"
            echo "添加 MONKEY_COOKIE 和 MONKEY_TASK_ID 两个密钥。"
            exit 1
          fi
          echo "✅ Secret 配置检查通过"

      - name: Send Heartbeat to MonkeyCode
        run: |
          echo "正在向 MonkeyCode 任务发送保活请求..."
          
          # 直接调用真实的获取任务状态与活跃度接口
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" \
            -X GET "https://monkeycode-ai.net/api/v1/users/tasks/${{ secrets.MONKEY_TASK_ID }}" \
            -H 'accept: */*' \
            -H 'accept-language: zh-CN,zh;q=0.9' \
            -H 'content-type: application/json' \
            -H "cookie: ${{ secrets.MONKEY_COOKIE }}" \
            -H 'dnt: 1' \
            -H 'priority: u=1, i' \
            -H 'sec-ch-ua: "Not)A;Brand";v="8", "Chromium";v="138"' \
            -H 'sec-ch-ua-mobile: ?0' \
            -H 'sec-ch-ua-platform: "Windows"' \
            -H 'sec-fetch-dest: empty' \
            -H 'sec-fetch-mode: cors' \
            -H 'sec-fetch-site: same-origin' \
            -H 'sec-gpc: 1' \
            -H 'user-agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/138.0.0.0 Safari/537.36')

          echo "HTTP 状态码: $HTTP_STATUS"
          echo "返回信息:"
          cat response.json
          echo ""

          if [[ "$HTTP_STATUS" =~ ^20[0-9]$ ]]; then
            echo "🎉 打卡成功！MonkeyCode 环境活跃时间已刷新至最新。"
          else
            echo "❌ 打卡失败！状态码为 $HTTP_STATUS"
            echo "提示：请排查 Cookie 是否过期失效，或者 Task ID 是否填写正确。"
            exit 1
          fi
