name: MonkeyCode VM Monitor

on:
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: monkeycode-vm-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Check 3x-ui panel
        shell: bash
        run: |
          set -e
          code="$(curl -sS -L --max-time 20 -o /dev/null -w '%{http_code}'             'https://48394-0ab6930e8b3423ba.monkeycode-ai.live/qXBSqdglxREBsxDKTM/')"
          echo "3x-ui HTTP=$code"
          test "$code" = "200"

      - name: Check ttyd preview
        shell: bash
        continue-on-error: true
        run: |
          code="$(curl -sS -L --max-time 20 -o /dev/null -w '%{http_code}'             'https://7681-0ab6930e8b3423ba.monkeycode-ai.live/' || true)"
          echo "ttyd HTTP=$code"
